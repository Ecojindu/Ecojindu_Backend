{% extends "base_email.html" %}
{% block content %}
<h1 style="margin:0 0 14px;font-size:25px;line-height:1.3;font-weight:800;color:#15181A;letter-spacing:-0.5px;">{{ heading }}</h1>
<p style="margin:0 0 22px;font-size:15px;line-height:1.7;color:#4A5450;">{{ body }}</p>

{% if code %}
<table role="presentation" width="100%" style="margin:0 0 22px;">
  <tr><td align="center" style="background:#F0F6EA;border:1px solid #D5E7C6;border-radius:14px;padding:22px;">
    <div style="font-size:11px;color:#4C8C2B;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;">{{ code_label | default('Your code') }}</div>
    <div style="font-size:36px;font-weight:800;color:#2F5233;letter-spacing:8px;margin-top:8px;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ code }}</div>
  </td></tr>
</table>
{% endif %}

{% if action_url %}
<table role="presentation" width="100%"><tr><td align="center">
  <a href="{{ action_url }}"
     style="display:inline-block;background:#4C8C2B;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:15px;padding:14px 30px;border-radius:999px;">
    {{ action_label | default('Continue') }}
  </a>
</td></tr></table>
{% endif %}

{% if footnote %}
<p style="margin:22px 0 0;font-size:13px;line-height:1.65;color:#8A918D;">{{ footnote }}</p>
{% endif %}
{% endblock %}
