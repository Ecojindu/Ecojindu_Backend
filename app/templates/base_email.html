<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ subject | default('Ecojindu Shuttle') }}</title>
</head>
<body style="margin:0;padding:0;background:#EAE8DB;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#15181A;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EAE8DB;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#FFFFFF;border-radius:20px;overflow:hidden;box-shadow:0 2px 16px rgba(47,82,51,0.10);">

        <!-- Header -->
        <tr><td style="background:#2F5233;padding:28px 32px;">
          <table role="presentation" width="100%"><tr>
            <td style="font-size:22px;font-weight:800;color:#FFFFFF;letter-spacing:-0.4px;">
              Ecojindu<span style="color:#7CB342;">Shuttle</span>
            </td>
            <td align="right" style="font-size:11px;color:#B8D8A8;text-transform:uppercase;letter-spacing:1.4px;">
              Zero-emission travel
            </td>
          </tr></table>
          <div style="height:3px;background:linear-gradient(90deg,#7CB342 0%,#2BAE8E 100%);border-radius:3px;margin-top:18px;"></div>
        </td></tr>

        <!-- Body -->
        <tr><td style="padding:32px;">
          {% block content %}{% endblock %}
        </td></tr>

        <!-- Footer -->
        <tr><td style="background:#F5F4EC;padding:24px 32px;border-top:1px solid #E2E0D2;">
          <p style="margin:0 0 8px;font-size:13px;color:#4A5450;line-height:1.6;">
            Questions? Reply to this email, call
            <a href="tel:{{ company.phone }}" style="color:#4C8C2B;text-decoration:none;font-weight:600;">{{ company.phone }}</a>,
            or message us on
            <a href="https://wa.me/{{ company.whatsapp | replace('+','') }}" style="color:#2BAE8E;text-decoration:none;font-weight:600;">WhatsApp</a>.
          </p>
          <p style="margin:0;font-size:12px;color:#8A918D;line-height:1.6;">
            {{ company.name }} · Nnenna Otti Bus Terminal, Umuahia, Abia State · {{ company.social }}<br />
            Bridging Cities, Powering Green Mobility.
          </p>
        </td></tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
